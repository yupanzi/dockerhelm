# Use case: web service + Envoy sidecar proxy + init container that waits for a dependency
workload:
  kind: Deployment
  replicas: 3

image:
  repository: ghcr.io/acme/api
  tag: v1.2.3

container:
  ports:
    - { name: http, containerPort: 8080, protocol: TCP }
  envFrom:
    - configMapRef: { name: api-config }
    - secretRef:    { name: api-secret }
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  livenessProbe:
    httpGet: { path: /healthz, port: http }
    initialDelaySeconds: 10
  readinessProbe:
    httpGet: { path: /ready, port: http }
    periodSeconds: 5

initContainers:
  - name: wait-for-db
    image: busybox:1.36
    command:
      - /bin/sh
      - -c
      - until nc -z db 5432; do echo waiting; sleep 2; done

extraContainers:
  - name: envoy
    image: envoyproxy/envoy:v1.30
    ports:
      - { name: proxy, containerPort: 9901 }
    volumeMounts:
      - name: envoy-config
        mountPath: /etc/envoy
    resources:
      requests: { cpu: 100m, memory: 128Mi }
  - name: log-shipper
    image: cr.fluentbit.io/fluent/fluent-bit:2.2
    volumeMounts:
      - name: app-logs
        mountPath: /var/log/app
        readOnly: true

volumes:
  - name: envoy-config
    configMap:
      name: envoy-config
  - name: app-logs
    emptyDir: {}

service:
  enabled: true
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }

# Automatic AWS ALB configuration example (requires aws-load-balancer-controller in the cluster;
# in non-AWS environments, remove the alb block and set className as needed)
ingress:
  enabled: true
  className: alb
  hostname: api.example.com
  alb:
    autoConfigure: true
    group: web-shared
    scheme: internet-facing
    certificateArn: arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
    extraAnnotations:
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
