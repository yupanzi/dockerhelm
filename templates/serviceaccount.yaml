{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dockerhelm.serviceAccountName" . }}
  labels:
    {{- include "dockerhelm.labels" . | nindent 4 }}
  {{- with include "dockerhelm.annotations" (dict "root" . "extra" .Values.serviceAccount.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
